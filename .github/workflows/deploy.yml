# Deploys the backend to the VPS on every push to main, after the full CI
# suite (backend + frontend, both timezones) passes.
#
# The image is built HERE and pushed to GHCR; the VPS only pulls and restarts
# (same pattern as warren-portfolio — the box never builds). Until the VPS_*
# secrets exist the deploy job skips cleanly (green, no-op), so this workflow
# can live on main before the server is provisioned.
# Setup steps and required secrets: docs/deploy.md.
name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys queue instead of cancelling: an interrupted migrate/restart is worse
# than a stale one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The default `docker` driver cannot export cache (`cache-to: type=gha`
      # fails); setup-buildx creates a `docker-container` builder, which can.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend/app
          push: true
          # Lowercase literal, NOT ${{ github.repository_owner }}: the owner is
          # `Stefanopellegrinoo` and GHCR rejects uppercase in image names.
          tags: |
            ghcr.io/stefanopellegrinoo/fitness-api:latest
            ghcr.io/stefanopellegrinoo/fitness-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy configuration
        id: cfg
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VPS secrets not set — skipping deploy (see docs/deploy.md)."
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'

      - name: Set up SSH
        if: steps.cfg.outputs.configured == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync compose file
        if: steps.cfg.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml \
            "$VPS_USER@$VPS_HOST:/opt/fitness-api/docker-compose.yml"

      - name: Pull, migrate, restart
        if: steps.cfg.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SHA: ${{ github.sha }}
        run: |
          ssh -n -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "
            set -euo pipefail
            cd /opt/fitness-api
            # Deploy the exact sha the suite just passed on, not whatever
            # 'latest' means by the time the pull runs.
            export FITNESS_IMAGE=ghcr.io/stefanopellegrinoo/fitness-api:$SHA
            docker compose pull -q api
            # run (not up) so migrations finish before the api starts serving;
            # compose brings postgres up healthy first via depends_on.
            docker compose run --rm api npx prisma migrate deploy
            docker compose up -d --remove-orphans
            sleep 3
            curl -fsS http://127.0.0.1:4002/health
          "
